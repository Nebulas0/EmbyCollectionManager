{% extends "base.html" %}
{% block title %}Logs - Emby Collection Manager{% endblock %}
{% block content %}
<h1>Sync Logs</h1>
<div class="card">
    <div class="flex justify-between items-center mb-3 flex-wrap gap-2">
        <div class="flex items-center gap-2 flex-wrap">
            <button class="btn btn-secondary btn-sm" onclick="refreshLogs()">Refresh</button>
            <label class="checkbox-label"><input type="checkbox" id="auto-refresh" onchange="toggleAutoRefresh()"> Auto-refresh</label>
            <span id="log-count" class="text-dim text-xs"></span>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="downloadLogs()">Download</button>
    </div>
    <pre id="log-content" style="max-height:600px;overflow-y:auto;white-space:pre-wrap;word-break:break-all">Loading...</pre>
</div>
{% endblock %}
{% block scripts %}
<script>
let autoRefresh = null;
async function refreshLogs(){
    try{
        const res=await fetch('/api/logs?lines=200');
        const data=await res.json();
        const content=document.getElementById('log-content');
        content.textContent=data.lines||'(no logs)';
        content.scrollTop=content.scrollHeight;
        const lines=(data.lines||'').split('\n').filter(l=>l.trim()).length;
        document.getElementById('log-count').textContent=lines+' lines';
    }catch(e){document.getElementById('log-content').textContent='Error: '+e}
}
function toggleAutoRefresh(){
    if(document.getElementById('auto-refresh').checked){
        autoRefresh=setInterval(refreshLogs,2000);
    }else{
        clearInterval(autoRefresh);autoRefresh=null;
    }
}
function downloadLogs(){
    const content=document.getElementById('log-content').textContent;
    const blob=new Blob([content],{type:'text/plain'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='ecm_logs_'+new Date().toISOString().slice(0,19).replace(/:/g,'-')+'.txt';
    a.click();
}
refreshLogs();
</script>
{% endblock %}
