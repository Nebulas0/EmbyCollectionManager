<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Emby Collection Manager{% endblock %}</title>
    <style>
        :root{
            --bg:#f5f6f8;
            --card:#ffffff;
            --card-hover:#f9fafb;
            --accent:#4f46e5;
            --accent-light:#eef2ff;
            --accent-hover:#4338ca;
            --text:#111827;
            --text-dim:#6b7280;
            --text-light:#9ca3af;
            --border:#e5e7eb;
            --border-light:#f3f4f6;
            --green:#10b981;
            --green-light:#ecfdf5;
            --red:#ef4444;
            --red-light:#fef2f2;
            --yellow:#f59e0b;
            --yellow-light:#fffbeb;
            --shadow:0 1px 3px rgba(0,0,0,.08);
            --shadow-md:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -2px rgba(0,0,0,.06);
            --shadow-lg:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.05);
            --radius:10px;
            --radius-sm:6px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
        .nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;height:56px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
        .nav-brand{font-size:1rem;font-weight:600;color:var(--text);margin-right:32px;display:flex;align-items:center;gap:8px;white-space:nowrap}
        .nav-brand svg{width:20px;height:20px;color:var(--accent)}
        .nav-links{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
        .nav a{color:var(--text-dim);text-decoration:none;padding:8px 14px;border-radius:var(--radius-sm);transition:all .15s;font-weight:500;font-size:.875rem}
        .nav a:hover{color:var(--text);background:var(--border-light)}
        .nav a.active{color:var(--accent);background:var(--accent-light)}
        .container{max-width:1100px;margin:24px auto;padding:0 24px}
        h1{font-size:1.5rem;font-weight:600;margin-bottom:20px;color:var(--text)}
        h2{font-size:1.125rem;font-weight:600;color:var(--text);margin-bottom:12px}
        h3{font-size:1rem;font-weight:600;color:var(--text);margin-bottom:10px}
        .card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;border:1px solid var(--border);box-shadow:var(--shadow)}
        .card-hover:hover{box-shadow:var(--shadow-md)}
        .form-group{margin-bottom:14px}
        .form-group label{display:block;margin-bottom:6px;color:var(--text-dim);font-size:.8125rem;font-weight:500}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:.875rem;transition:border-color .15s,box-shadow .15s}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-light)}
        .form-group input[readonly]{background:var(--border-light);color:var(--text-dim)}
        .form-row{display:flex;gap:14px}
        .form-row .form-group{flex:1}
        .btn{padding:8px 16px;border:1px solid transparent;border-radius:var(--radius-sm);cursor:pointer;font-size:.8125rem;font-weight:500;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
        .btn-primary{background:var(--accent);color:#fff}
        .btn-primary:hover{background:var(--accent-hover)}
        .btn-secondary{background:var(--card);color:var(--text);border-color:var(--border)}
        .btn-secondary:hover{background:var(--border-light);border-color:var(--text-light)}
        .btn-green{background:var(--green);color:#fff}
        .btn-green:hover{opacity:.9}
        .btn-danger{color:var(--red);border-color:var(--border);background:var(--card)}
        .btn-danger:hover{background:var(--red-light);border-color:var(--red)}
        .btn-sm{padding:5px 10px;font-size:.75rem}
        .btn:disabled{opacity:.5;cursor:not-allowed}
        .alert{padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:14px;font-size:.8125rem}
        .alert-success{background:var(--green-light);border:1px solid #a7f3d0;color:#065f46}
        .alert-error{background:var(--red-light);border:1px solid #fecaca;color:#991b1b}
        .alert-info{background:var(--yellow-light);border:1px solid #fde68a;color:#92400e}
        .toggle{position:relative;width:40px;height:22px;display:inline-block;flex-shrink:0}
        .toggle input{opacity:0;width:0;height:0}
        .toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--border);border-radius:22px;transition:.2s}
        .toggle-slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
        .toggle input:checked+.toggle-slider{background:var(--green)}
        .toggle input:checked+.toggle-slider:before{transform:translateX(18px)}
        .checkbox-label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.8125rem;color:var(--text-dim);white-space:nowrap}
        .checkbox-label input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
        .recipe-list{list-style:none}
        .recipe-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border-light);transition:background .15s;border-radius:var(--radius-sm)}
        .recipe-item:hover{background:var(--border-light)}
        .recipe-item:last-child{border-bottom:none}
        .recipe-row{margin-bottom:2px}
        .recipe-name{flex:1;font-size:.875rem;font-weight:500;display:flex;align-items:center;gap:8px;min-width:0}
        .recipe-cat{font-size:.6875rem;color:var(--text-dim);background:var(--border-light);padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0}
        .category-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--border-light);border-radius:var(--radius-sm);margin:12px 0 6px;font-weight:600;font-size:.8125rem;color:var(--text)}
        .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
        .stat-card{background:var(--card);border-radius:var(--radius);padding:18px;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow)}
        .stat-value{font-size:1.75rem;font-weight:700;color:var(--text)}
        .stat-label{color:var(--text-dim);font-size:.75rem;margin-top:4px;font-weight:500}
        .sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
        .sync-dot.idle{background:var(--text-light)}
        .sync-dot.running{background:var(--yellow);animation:pulse 1.5s infinite}
        .sync-dot.success{background:var(--green)}
        .sync-dot.error{background:var(--red)}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        .lib-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border-light)}
        .lib-item:hover{background:var(--border-light)}
        .lib-item:last-child{border-bottom:none}
        .lib-info{flex:1}
        .lib-name{font-weight:500;font-size:.875rem}
        .lib-type{font-size:.75rem;color:var(--text-dim)}
        .checkbox{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
        .file-list{list-style:none}
        .file-item{padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px}
        .file-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .file-content{background:var(--bg);padding:10px;border-radius:var(--radius-sm);font-family:'SF Mono',Monaco,Consolas,'Courier New',monospace;font-size:.8125rem;white-space:pre-wrap;max-height:200px;overflow-y:auto;color:var(--text-dim)}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:200;justify-content:center;align-items:center;backdrop-filter:blur(2px)}
        .modal.active{display:flex}
        .modal-content{background:var(--card);border-radius:var(--radius);padding:24px;width:90%;max-width:560px;border:1px solid var(--border);box-shadow:var(--shadow-lg);max-height:85vh;overflow-y:auto}
        .test-result{padding:8px 12px;border-radius:var(--radius-sm);margin-top:8px;font-size:.8125rem}
        .test-result.ok{background:var(--green-light);color:#065f46}
        .test-result.fail{background:var(--red-light);color:#991b1b}
        .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:.6875rem;font-weight:600}
        .badge-green{background:var(--green-light);color:#065f46}
        .badge-red{background:var(--red-light);color:#991b1b}
        .badge-gray{background:var(--border-light);color:var(--text-dim)}
        .progress-bar{background:var(--border-light);border-radius:4px;height:6px;overflow:hidden}
        .progress-bar-fill{background:var(--accent);height:100%;transition:width .3s;border-radius:4px}
        .text-dim{color:var(--text-dim)}
        .text-sm{font-size:.8125rem}
        .text-xs{font-size:.75rem}
        .mt-0{margin-top:0}.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
        .mb-0{margin-bottom:0}.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
        .flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}
        .flex-wrap{flex-wrap:wrap}
        pre{background:var(--bg);padding:12px;border-radius:var(--radius-sm);font-size:.8125rem;overflow-x:auto;border:1px solid var(--border);font-family:'SF Mono',Monaco,Consolas,monospace}
        @media(max-width:768px){.form-row{flex-direction:column}.nav{height:auto;padding:10px 16px;flex-direction:column;align-items:flex-start;gap:8px}.nav-links{overflow-x:auto;width:100%}.container{padding:0 16px}}
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
            Emby Collection Manager
        </div>
        <div class="nav-links">
            <a href="/dashboard" class="{% if request.path == '/dashboard' %}active{% endif %}">Dashboard</a>
            <a href="/collections" class="{% if request.path == '/collections' %}active{% endif %}">Collections</a>
            <a href="/mdblists" class="{% if request.path == '/mdblists' %}active{% endif %}">MDBLists</a>
            <a href="/traktlists" class="{% if request.path == '/traktlists' %}active{% endif %}">Trakt Lists</a>
            <a href="/artwork" class="{% if request.path == '/artwork' %}active{% endif %}">Artwork</a>
            <a href="/libraries" class="{% if request.path == '/libraries' %}active{% endif %}">Libraries</a>
            <a href="/settings" class="{% if request.path == '/settings' %}active{% endif %}">Settings</a>
            <a href="/logs" class="{% if request.path == '/logs' %}active{% endif %}">Logs</a>
        </div>
    </nav>
    <div class="container">{% block content %}{% endblock %}</div>
    {% block scripts %}{% endblock %}
</body>
</html>
