version: '3.8'

services:
  emby-collection-manager:
    build: .
    container_name: emby-collection-manager
    ports:
      - "8282:8282"
    volumes:
      - ./config:/app/config
      - ./traktlists:/app/traktlists
      - ./mdblists:/app/mdblists
    environment:
      - WEBUI_PORT=8282
      - SYNC_TARGET=auto
    restart: unless-stopped
