# Config file for Emby Collection Manager
# API keys and server details organized by service
# This file is managed by the Web UI at http://localhost:8282

# TMDb configuration
tmdb:
  api_key: "YOUR TMDB API KEY"

# Emby configuration
emby:
  api_key: "YOUR EMBY API KEY"
  server_url: "YOUR EMBY URL"
  user_id: "YOUR EMBY USER ID"
  # Optional: list of library IDs to restrict scanning
  # If empty or not set, all libraries will be scanned
  library_ids: []

# Trakt configuration (optional - see README.md for how to get these)
trakt:
  client_id: "YOUR TRAKT CLIENT ID"
  client_secret: "YOUR TRAKT CLIENT SECRET"
  username: "me"

# Trakt lists configuration
traktlists:
  enabled: true
  directory: "traktlists"
  max_items_per_collection: 0

# MDBList configuration (optional)
mdblist:
  api_key: "YOUR MDBLIST API KEY"

# MDBList local files configuration
mdblists:
  enabled: true
  directory: "mdblists"
  max_items_per_collection: 0

# Custom poster generation settings
poster_settings:
  enable_custom_posters: true
  template_name: "default.png"
  text_color: [255, 255, 255]
  bg_color: [0, 0, 0, 128]
  text_position: 0.5
